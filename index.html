<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Browser Shogi AI</title>

<script src="./coi-serviceworker.js"></script>

<style>
html,body{
  margin:0;
  background:#171717;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif
}
#boot{
  padding:24px;
  font-size:16px;
}
#boot pre{
  white-space:pre-wrap;
  background:#0d0d0d;
  padding:12px;
  border-radius:8px;
  color:#ffb4b4;
}
</style>

<script>
window.addEventListener("error",function(e){
  var msg=(e.error&&e.error.stack)||e.message||"不明なJavaScriptエラー";
  document.body.innerHTML=
    '<div id="boot"><b>JavaScriptエラーが発生しました</b><pre>'+
    String(msg).replace(/&/g,"&amp;").replace(/</g,"&lt;")+
    '</pre></div>';
});

window.addEventListener("unhandledrejection",function(e){
  var r=e.reason;
  var msg=(r&&r.stack)||String(r);
  document.body.innerHTML=
    '<div id="boot"><b>Promiseエラーが発生しました</b><pre>'+
    String(msg).replace(/&/g,"&amp;").replace(/</g,"&lt;")+
    '</pre></div>';
});
</script>
</head>

<body>
<div id="app">
  <div id="boot">将棋AIを読み込んでいます…</div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check YaneuraOu files
        run: |
          echo "=== YaneuraOu package ==="
          find node_modules/@mizarjp/yaneuraou.halfkp.noeval -maxdepth 3 -type f | sort
      
      - name: Inspect YaneuraOu memory and thread settings
        run: |
          echo "=== YaneuraOu build settings ==="
          JS="node_modules/@mizarjp/yaneuraou.halfkp.noeval/lib/yaneuraou.halfkp.noeval.js"
          WASM="node_modules/@mizarjp/yaneuraou.halfkp.noeval/lib/yaneuraou.halfkp.noeval.wasm"
          WORKER="node_modules/@mizarjp/yaneuraou.halfkp.noeval/lib/yaneuraou.halfkp.noeval.worker.js"
          grep -nE "PTHREAD_POOL_SIZE|INITIAL_MEMORY|TOTAL_MEMORY|ALLOW_MEMORY_GROWTH" "$JS" | head -50 || true
          echo "=== file sizes ==="
          ls -lh "$JS" "$WASM" "$WORKER"

      - name: Copy YaneuraOu WASM
        run: |
          mkdir -p public
          cp node_modules/@mizarjp/yaneuraou.halfkp.noeval/lib/yaneuraou.halfkp.noeval.wasm public/yaneuraou.halfkp.noeval.wasm

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

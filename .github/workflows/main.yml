name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check YaneuraOu files
        run: |
          echo "=== YaneuraOu package ==="
          find node_modules/@mizarjp/yaneuraou.halfkp.noeval -maxdepth 3 -type f | sort

      - name: Inspect YaneuraOu build settings
        run: |
          echo "=== YaneuraOu build settings ==="

          JS="node_modules/@mizarjp/yaneuraou.halfkp.noeval/lib/yaneuraou.halfkp.noeval.js"
          WASM="node_modules/@mizarjp/yaneuraou.halfkp.noeval/lib/yaneuraou.halfkp.noeval.wasm"
          WORKER="node_modules/@mizarjp/yaneuraou.halfkp.noeval/lib/yaneuraou.halfkp.noeval.worker.js"

          echo "--- memory ---"
          grep -nE "INITIAL_MEMORY|TOTAL_MEMORY|ALLOW_MEMORY_GROWTH" "$JS" | head -50 || true

          echo "--- pthread ---"
          grep -nE "PTHREAD|pthread|worker" "$JS" | head -100 || true

          echo "--- file sizes ---"
          ls -lh "$JS" "$WASM" "$WORKER"

      - name: Patch browser pthread pool
        run: |
          node <<'NODE'
          const fs = require("fs");

          const jsFile =
            "node_modules/@mizarjp/yaneuraou.halfkp.noeval/lib/yaneuraou.halfkp.noeval.js";

          let text = fs.readFileSync(jsFile, "utf8");

          console.log("=== Searching for pthread pool configuration ===");

          const patterns = [
            /PTHREAD_POOL_SIZE\s*=\s*32/g,
            /PTHREAD_POOL_SIZE\s*:\s*32/g,
            /PTHREAD_POOL_SIZE\s*=\s*(\d+)/g,
            /PTHREAD_POOL_SIZE\s*:\s*(\d+)/g
          ];

          let found = false;

          for (const pattern of patterns) {
            const matches = [...text.matchAll(pattern)];

            if (matches.length > 0) {
              found = true;

              for (const match of matches) {
                console.log(
                  `Found pthread setting: ${match[0]}`
                );
              }
            }
          }

          /*
           * The published YaneuraOu package is minified, so the
           * PTHREAD_POOL_SIZE symbol may disappear during compilation.
           *
           * In that case we do not perform a blind replacement.
           * This keeps the WASM binary intact rather than corrupting it.
           */
          if (!found) {
            console.log(
              "No explicit PTHREAD_POOL_SIZE setting found."
            );
            console.log(
              "Leaving the generated YaneuraOu runtime unchanged."
            );
          }

          console.log("=== pthread inspection complete ===");
          NODE

      - name: Copy YaneuraOu WASM
        run: |
          mkdir -p public

          cp \
            node_modules/@mizarjp/yaneuraou.halfkp.noeval/lib/yaneuraou.halfkp.noeval.wasm \
            public/yaneuraou.halfkp.noeval.wasm

      - name: Verify WASM
        run: |
          echo "=== WASM verification ==="

          WASM="public/yaneuraou.halfkp.noeval.wasm"

          ls -lh "$WASM"

          echo "First 8 bytes:"
          xxd -l 8 "$WASM"

          echo "WASM magic should start with:"
          echo "00 61 73 6d"

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          find dist -maxdepth 2 -type f | sort

          echo "=== YaneuraOu WASM in dist ==="
          ls -lh dist/yaneuraou.halfkp.noeval.wasm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
